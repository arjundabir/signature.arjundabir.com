<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draw your signature and animate it with CSS"
    />
    <title>Signature → CSS</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="flex flex-col max-h-[calc(100vh-16px)] h-[calc(100vh-16px)]">
      <main
        class="mx-auto container max-w-[600px] px-4 pb-4 grow overflow-y-auto"
      >
        <div class="sticky top-0 bg-white py-4">
          <header class="leading-6 text-base">
            <h1 class="font-medium">Animate Signature</h1>
            <p class="text-gray-500">
              Convert your handwriting to HTML/CSS that you can add anywhere
            </p>
          </header>
          <div
            id="container"
            class="mx-auto w-full h-[200px] border border-gray-200 bg-white relative rounded shadow-sm"
          >
            <svg id="signature" class="w-full h-full"></svg>
          </div>

          <button
            id="play-button"
            class="mt-1 inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-gray-100 text-black shadow-xs hover:bg-gray-100/80 h-9 px-4 py-2 has-[>svg]:px-3 hover:no-underline"
          >
            Animate Signature
          </button>
        </div>

        <div id="code" />
      </main>
      <footer class="flex-none max-h-10 p-8 flex justify-center">
        <a href="https://arjundabir.com" class="inline-block size-10">
          <svg
            id="Layer_1"
            class="logoPath"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 400 400"
          >
            <path
              class="path1"
              d="M357.79,5.91c-16.64,4.83-38.41,7.94-70.9,20.7-80.31,31.54-124.25,59.5-194.96,81.57-16.4,5.12-49.85,19.46-71.2,24.53-11.34,2.69-19.46,3.86-20.18,1.87-.74-2.02,6.12-7.57,17.35-13.32,20.12-10.31,54.27-21.26,83.96-13.66,30.02,7.69,40.85,27.32,55.42,100.4,5.61,28.14-7.48-235.94-16.27-204.97-2.35,8.28-8.8,45.64-39.15,104.57-22.03,42.76-49.96,72.97-71.16,92.46"
            />
          </svg>
        </a>
      </footer>
    </div>
    <script src="main.js"></script>
  </body>
</html>
